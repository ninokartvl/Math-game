<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Учительский кабинет — Таблица умножения</title>
  <!--
    © 2026 Предеина Нина Владимировна (predeinanina10@gmail.com)
    Лицензия: MIT License
  -->
  <style>
    * { font-family: 'Segoe UI', Roboto, system-ui, sans-serif; box-sizing: border-box; }
    body { background: linear-gradient(145deg, #f0ebf8 0%, #e0d4f0 100%); padding: 20px; max-width: 1200px; margin: 0 auto; min-height: 100vh; }
    h1 { color: #2d1b4e; text-align: center; margin: 0 0 8px; font-size: 2rem; }
    .subtitle { text-align: center; color: #6a5a8a; margin-bottom: 24px; }
    .control-panel { background: white; padding: 20px; border-radius: 24px; box-shadow: 0 8px 24px rgba(45, 27, 78, 0.12); margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; justify-content: center; }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    .control-group label { font-weight: 700; color: #2d1b4e; font-size: 0.9rem; }
    .control-group select, .control-group input { padding: 10px 16px; border-radius: 40px; border: 2px solid #d8c9f0; font-size: 1rem; background: #fcf9ff; min-width: 220px; transition: 0.15s; }
    .control-group select:focus, .control-group input:focus { outline: none; border-color: #8466ac; background: white; }
    .btn { border: none; padding: 12px 24px; border-radius: 40px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.1s; box-shadow: 0 4px 0 rgba(0,0,0,0.15); white-space: nowrap; }
    .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.15); }
    .btn-primary { background: #2d1b4e; color: white; }
    .btn-success { background: #2a7a2a; color: white; }
    .btn-danger { background: #b33; color: white; }
    .btn-secondary { background: #e0d4f0; color: #2d1b4e; }
    .stats-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .stat-card { background: white; padding: 18px; border-radius: 20px; text-align: center; box-shadow: 0 6px 16px rgba(45, 27, 78, 0.08); border: 2px solid #e0d4f0; }
    .stat-card .stat-value { font-size: 2rem; font-weight: 800; color: #2d1b4e; line-height: 1.1; }
    .stat-card .stat-label { font-size: 0.85rem; color: #6a5a8a; margin-top: 4px; font-weight: 600; }
    .table-wrapper { background: white; border-radius: 24px; box-shadow: 0 8px 24px rgba(45, 27, 78, 0.12); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #2d1b4e; color: white; padding: 14px 12px; text-align: left; font-size: 0.9rem; cursor: pointer; user-select: none; white-space: nowrap; }
    th:hover { background: #3d2a66; }
    th .sort-arrow { opacity: 0.5; margin-left: 6px; }
    td { padding: 12px; border-bottom: 1px solid #f0ebf8; }
    tr:hover { background: #faf7ff; }
    tr:last-child td { border-bottom: none; }
    .badge { background: linear-gradient(135deg, #ffd966, #ffc107); color: #5c3d00; padding: 4px 12px; border-radius: 20px; font-weight: 800; display: inline-block; font-size: 0.9rem; }
    .stars { font-size: 1rem; letter-spacing: 1px; }
    .name-cell { font-weight: 700; color: #2d1b4e; }
    .empty-msg { text-align: center; padding: 60px 20px; color: #8a7aa8; font-size: 1.1rem; }
    .empty-msg .emoji { font-size: 3rem; display: block; margin-bottom: 12px; }
    .footer { margin-top: 30px; text-align: center; color: #8a7aa8; border-top: 2px dashed #c8b8e0; padding-top: 20px; font-size: 0.9rem; }
    .parent-search { background: white; padding: 16px 20px; border-radius: 24px; box-shadow: 0 6px 16px rgba(45, 27, 78, 0.08); margin-bottom: 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: center; }
    .parent-search input { padding: 10px 16px; border-radius: 40px; border: 2px solid #d8c9f0; font-size: 1rem; background: #fcf9ff; min-width: 240px; }
    @media (max-width: 600px) { .control-panel { padding: 16px; } .control-group select, .control-group input { min-width: 140px; } th, td { padding: 10px 8px; font-size: 0.85rem; } .stars { font-size: 0.8rem; letter-spacing: 0; } .parent-search input { min-width: 160px; } }
  </style>
</head>
<body>

<h1>📊 Учительский кабинет</h1>
<p class="subtitle">Выберите школу и класс, чтобы увидеть результаты</p>

<div class="control-panel">
  <div class="control-group">
    <label for="schoolSelect">🏫 Школа</label>
    <select id="schoolSelect">
      <option value="">-- Выберите школу --</option>
    </select>
  </div>
  <div class="control-group">
    <label for="classSelect">📚 Класс</label>
    <select id="classSelect">
      <option value="">-- Выберите класс --</option>
    </select>
  </div>
  <button class="btn btn-primary" onclick="loadStats()">📊 Показать</button>
  <button class="btn btn-secondary" onclick="refreshData()">🔄 Обновить</button>
</div>

<div class="parent-search">
  <label style="font-weight:700; color:#2d1b4e;">👨‍👩‍👧 Найти ученика:</label>
  <input type="text" id="studentSearch" placeholder="Введите фамилию и имя" oninput="searchStudent()">
</div>

<div class="stats-summary" id="statsSummary" style="display:none;">
  <div class="stat-card">
    <div class="stat-value" id="statStudents">0</div>
    <div class="stat-label">👨‍🎓 Учеников</div>
  </div>
  <div class="stat-card">
    <div class="stat-value" id="statCups">0</div>
    <div class="stat-label">🏅 Всего кубков</div>
  </div>
  <div class="stat-card">
    <div class="stat-value" id="statStars">0</div>
    <div class="stat-label">⭐ Всего звёзд</div>
  </div>
  <div class="stat-card">
    <div class="stat-value" id="statAvg">0</div>
    <div class="stat-label">📈 Средний кубков</div>
  </div>
</div>

<div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; justify-content:center;">
  <button class="btn btn-success" onclick="exportExcel()">📥 Скачать CSV</button>
  <button class="btn btn-primary" onclick="exportJSON()">📄 Скачать JSON</button>
  <button class="btn btn-danger" onclick="clearClassData()">🗑️ Очистить класс</button>
</div>

<div class="table-wrapper">
  <table id="statsTable">
    <thead>
      <tr>
        <th onclick="sortBy('name')">👤 Ученик <span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('cups')">🏅 Кубки <span class="sort-arrow">↕</span></th>
        <th>⭐ Ур.1</th>
        <th>⭐ Ур.2</th>
        <th>⭐ Ур.3</th>
        <th>⭐ Ур.4</th>
        <th>⭐ Ур.5</th>
        <th>⭐ Ур.6</th>
      </tr>
    </thead>
    <tbody id="statsBody"></tbody>
  </table>
</div>

<div class="footer">
  © 2026 Предеина Нина Владимировна • predeinanina10@gmail.com • MIT License
</div>

<script>
  let currentSort = { field: 'name', asc: true };

  // ---- СПИСОК ШКОЛ (ТОЧНО КАК В ИГРЕ!) ----
  const SCHOOLS_LIST = [
    "МБОУ Гимназия №2 г. Красногорска",
    "МБОУ СОШ №18 г. Красногорска",
    "МБОУ СОШ №15 г. Красногорска",
    "МБОУ НОШ №17 г. Красногорска",
    "МБОУ СОШ №12 г. Красногорска",
    "МБОУ СОШ №1 г. Красногорска",
    "МБОУ СОШ №11 г. Красногорска",
    "МБОУ СОШ №19 г. Красногорска",
    "МБОУ СОШ №14 микрор-на Павшинская пойма г. Красногорска",
    "МБОУ СОШ №10 с углубленным изучением отдельных предметов г. Красногорска",
    "МБОУ Лицей №4 г. Красногорска",
    "МБОУ СОШ №16 г. Красногорска",
    "МБОУ гимназия №6 г. Красногорска",
    "МБОУ гимназия № 7 им. Д. П. Яковлева г. Красногорска",
    "МБОУ Гимназия №5 г. Красногорска",
    "МБОУ Опалиховская гимназия",
    "МБОУ СОШ № 8 г. Красногорска Московской области",
    "МБОУ СОШ №9 г. Красногорска",
    "МБОУ Образовательный центр Полёт",
    "МБОУ СОШ №20 Красногорского муниципального района",
    "МБОУ СОШ №3 г. Красногорска",
    "ЧОУ СОШ Исток",
    "МБОУ Начальная школа-детский сад",
    "МБОУ Ангеловская СОШ",
    "МБОУ СОШ Мозаика",
    "ЧУ ОО Школа Екатерининский лицей",
    "ЧОУ ОШ Светлые Горы",
    "ЧОУ СОШ Международная английская школа",
    "Начальная школа МИР",
    "НОЧУ Свято-Георгиевская гимназия",
    "Семейная школа Олимп и Я",
    "МБОУ Образовательный центр Созвездие",
    "Детский клуб Изумрудный город",
    "ГБ ПОУ МО Красногорский колледж",
    "ООО Академия Современного Образования",
    "АНО ДО ОСТРОВ ДЕТСТВА",
    "МБДОУ Детский сад 9",
    "Детский развивающий центр Академия нескучных наук",
    "МБДОУ детский сад №8",
    "ЧОУ школа с углубленным изучением иностранных языков Мир знаний",
    "ОАНО Школа Спутник",
    "ЧОУ Международный лицей информатики, экономики и права",
    "Центр семейного образования Гусёнок",
    "МБДОУ Детский сад 39",
    "МБДОУ детский сад № 38",
    "МБДОУ детский сад №49",
    "SmartTeam",
    "МБДОУ Детский сад №28",
    "АНО обучения детей Наследие",
    "Частная школа Под солнцем",
    "МБДОУ детский сад №27 Чароит",
    "Клуб поддержки семейного образования Хорошая школа",
    "Тестовая школа Красногорск",
    "МБУ ДО Центр творчества",
    "Частная семейная школа СОВА"
  ];

  function getAllData() {
    return JSON.parse(localStorage.getItem('mathTrainerAllStudents') || '{}');
  }

  function loadSchoolSelect() {
    const select = document.getElementById('schoolSelect');
    const current = select.value;
    select.innerHTML = '<option value="">-- Выберите школу --</option>';
    SCHOOLS_LIST.forEach(school => {
      const opt = document.createElement('option');
      opt.value = school;
      opt.textContent = school;
      select.appendChild(opt);
    });
    if (current) select.value = current;
    loadClassSelect();
  }

  function loadClassSelect() {
    const school = document.getElementById('schoolSelect').value;
    const select = document.getElementById('classSelect');
    const current = select.value;
    select.innerHTML = '<option value="">-- Выберите класс --</option>';
    if (!school) return;
    const data = getAllData();
    const classes = new Set();
    Object.values(data).forEach(entry => {
      if (entry.school === school && entry.class) classes.add(entry.class);
    });
    Array.from(classes).sort().forEach(cls => {
      const opt = document.createElement('option');
      opt.value = cls;
      opt.textContent = cls;
      select.appendChild(opt);
    });
    if (current) select.value = current;
  }

  document.getElementById('schoolSelect').addEventListener('change', loadClassSelect);

  function loadStats() {
    const school = document.getElementById('schoolSelect').value;
    const className = document.getElementById('classSelect').value;
    const tbody = document.getElementById('statsBody');
    const summary = document.getElementById('statsSummary');

    if (!school || !className) {
      tbody.innerHTML = '<tr><td colspan="8" class="empty-msg"><span class="emoji">🏫</span>Выберите школу и класс</td></tr>';
      summary.style.display = 'none';
      return;
    }

    const data = getAllData();
    let students = Object.values(data).filter(e => e.school === school && e.class === className);

    if (students.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" class="empty-msg"><span class="emoji">📭</span>В выбранном классе пока нет учеников</td></tr>`;
      summary.style.display = 'none';
      return;
    }

    students.sort((a, b) => {
      let va, vb;
      if (currentSort.field === 'cups') { va = a.cups || 0; vb = b.cups || 0; }
      else { va = a.name || ''; vb = b.name || ''; }
      if (typeof va === 'string') return currentSort.asc ? va.localeCompare(vb) : vb.localeCompare(va);
      return currentSort.asc ? va - vb : vb - va;
    });

    let totalCups = 0, totalStars = 0;
    tbody.innerHTML = '';
    students.forEach(s => {
      totalCups += s.cups || 0;
      const lc = s.levelCups || [0,0,0,0,0,0];
      totalStars += lc.reduce((a,b) => a + b, 0);
      const row = document.createElement('tr');
      row.innerHTML = `
        <td class="name-cell">${s.name || '—'}</td>
        <td><span class="badge">${s.cups || 0}</span></td>
        ${[0,1,2,3,4,5].map(i => 
          `<td class="stars">${'⭐'.repeat(lc[i] || 0)}${'☆'.repeat(3-(lc[i] || 0))}</td>`
        ).join('')}
      `;
      tbody.appendChild(row);
    });

    summary.style.display = 'grid';
    document.getElementById('statStudents').textContent = students.length;
    document.getElementById('statCups').textContent = totalCups;
    document.getElementById('statStars').textContent = totalStars;
    document.getElementById('statAvg').textContent = (totalCups / students.length).toFixed(1);
  }

  function sortBy(field) {
    if (currentSort.field === field) currentSort.asc = !currentSort.asc;
    else { currentSort.field = field; currentSort.asc = true; }
    loadStats();
  }

  function refreshData() {
    loadSchoolSelect();
    loadStats();
  }

  function searchStudent() {
    const query = document.getElementById('studentSearch').value.trim().toLowerCase();
    const tbody = document.getElementById('statsBody');
    if (!query) { loadStats(); return; }
    const data = getAllData();
    const found = Object.values(data).filter(e => 
      e.name && e.name.toLowerCase().includes(query)
    );
    if (found.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" class="empty-msg"><span class="emoji">🔍</span>Ученик не найден</td></tr>`;
      return;
    }
    tbody.innerHTML = '';
    found.forEach(s => {
      const lc = s.levelCups || [0,0,0,0,0,0];
      const row = document.createElement('tr');
      row.innerHTML = `
        <td class="name-cell">${s.name} <small style="color:#8a7aa8;">(${s.class})</small></td>
        <td><span class="badge">${s.cups || 0}</span></td>
        ${[0,1,2,3,4,5].map(i => 
          `<td class="stars">${'⭐'.repeat(lc[i] || 0)}${'☆'.repeat(3-(lc[i] || 0))}</td>`
        ).join('')}
      `;
      tbody.appendChild(row);
    });
  }

  function getDataForClass(school, className) {
    const data = getAllData();
    const result = {};
    Object.values(data).forEach(entry => {
      if (entry.school === school && entry.class === className) {
        result[entry.name] = entry;
      }
    });
    return result;
  }

  function exportExcel() {
    const school = document.getElementById('schoolSelect').value;
    const className = document.getElementById('classSelect').value;
    if (!school || !className) { alert('Выберите школу и класс'); return; }
    const data = getDataForClass(school, className);
    const names = Object.keys(data);
    if (names.length === 0) { alert('Нет данных'); return; }
    let csv = 'Ученик,Кубки,Ур.1,Ур.2,Ур.3,Ур.4,Ур.5,Ур.6\n';
    names.forEach(name => {
      const s = data[name];
      csv += `${name},${s.cups || 0},${(s.levelCups || [0,0,0,0,0,0]).join(',')}\n`;
    });
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `школа_${className}.csv`; a.click();
    URL.revokeObjectURL(url);
  }

  function exportJSON() {
    const school = document.getElementById('schoolSelect').value;
    const className = document.getElementById('classSelect').value;
    if (!school || !className) { alert('Выберите школу и класс'); return; }
    const data = getDataForClass(school, className);
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `школа_${className}.json`; a.click();
    URL.revokeObjectURL(url);
  }

  function clearClassData() {
    const school = document.getElementById('schoolSelect').value;
    const className = document.getElementById('classSelect').value;
    if (!school || !className) { alert('Выберите школу и класс'); return; }
    if (!confirm(`Удалить данные класса ${className}?`)) return;
    const allData = getAllData();
    Object.keys(allData).forEach(key => {
      const entry = allData[key];
      if (entry.school === school && entry.class === className) delete allData[key];
    });
    localStorage.setItem('mathTrainerAllStudents', JSON.stringify(allData));
    refreshData();
  }

  loadSchoolSelect();
</script>
</body>
</html>
